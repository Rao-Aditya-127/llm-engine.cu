<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llm-engine.cu</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px;
        }

        .container { width: 100%; max-width: 760px; }

        header { margin-bottom: 32px; }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.03em;
        }
        h1 span { color: #4ade80; }

        .subtitle { font-size: 0.82rem; color: #555; margin-top: 5px; }

        .card {
            background: #161616;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.6;
            padding: 12px 14px;
            resize: vertical;
            min-height: 96px;
            outline: none;
            transition: border-color 0.15s;
        }
        textarea:focus { border-color: #4ade80; }

        .controls {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .control-group { flex: 1; }

        input[type="number"] {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.9rem;
            padding: 9px 12px;
            outline: none;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #4ade80;
            margin-top: 4px;
        }

        .range-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .range-label span:first-child {
            font-size: 0.75rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .range-label span:last-child {
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: 600;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 20px; }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        #btn-generate {
            flex: 1;
            background: #4ade80;
            color: #000;
        }
        #btn-generate:hover:not(:disabled) { background: #86efac; }
        #btn-generate.stopping { background: #ef4444; color: #fff; }
        #btn-generate:disabled { background: #222; color: #444; cursor: not-allowed; }

        #btn-clear {
            background: #1a1a1a;
            color: #666;
            border: 1px solid #242424;
        }
        #btn-clear:hover { background: #222; color: #999; }

        .output-card {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 20px 24px;
            min-height: 180px;
        }

        #output {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #d0d0d0;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 120px;
        }
        #output.placeholder { color: #333; }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #4ade80;
            margin-left: 1px;
            vertical-align: text-bottom;
            animation: blink 0.9s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .stats {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #1a1a1a;
        }

        .stat { font-size: 0.78rem; color: #444; }
        .stat b { color: #4ade80; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>llm-engine<span>.cu</span></h1>
        <p class="subtitle">Qwen2-0.5B &nbsp;·&nbsp; FP16 &nbsp;·&nbsp; Hand-written CUDA kernels &nbsp;·&nbsp; No frameworks</p>
    </header>

    <div class="card">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Enter your prompt…">The capital of France is</textarea>

        <div class="controls">
            <div class="control-group">
                <label for="max-tokens">Max tokens</label>
                <input type="number" id="max-tokens" value="200" min="1" max="2000">
            </div>
            <div class="control-group">
                <div class="range-label">
                    <span>Temperature</span>
                    <span id="temp-val">0.00</span>
                </div>
                <input type="range" id="temperature" min="0" max="1" step="0.05" value="0">
            </div>
        </div>

        <div class="btn-row">
            <button id="btn-generate">Generate</button>
            <button id="btn-clear">Clear</button>
        </div>
    </div>

    <div class="output-card">
        <div id="output" class="placeholder">Output will appear here…</div>
        <div class="stats">
            <div class="stat">Tokens &nbsp;<b id="stat-tokens">—</b></div>
            <div class="stat">Time &nbsp;<b id="stat-time">—</b></div>
            <div class="stat">Speed &nbsp;<b id="stat-speed">—</b></div>
        </div>
    </div>
</div>

<script>
    const promptEl    = document.getElementById('prompt');
    const maxTokensEl = document.getElementById('max-tokens');
    const tempEl      = document.getElementById('temperature');
    const tempValEl   = document.getElementById('temp-val');
    const btnGenerate = document.getElementById('btn-generate');
    const btnClear    = document.getElementById('btn-clear');
    const outputEl    = document.getElementById('output');
    const statTokens  = document.getElementById('stat-tokens');
    const statTime    = document.getElementById('stat-time');
    const statSpeed   = document.getElementById('stat-speed');

    let controller = null;

    tempEl.addEventListener('input', () => {
        tempValEl.textContent = parseFloat(tempEl.value).toFixed(2);
    });

    btnClear.addEventListener('click', () => {
        if (controller) { controller.abort(); controller = null; }
        outputEl.textContent = 'Output will appear here…';
        outputEl.classList.add('placeholder');
        statTokens.textContent = '—';
        statTime.textContent   = '—';
        statSpeed.textContent  = '—';
        resetBtn();
    });

    btnGenerate.addEventListener('click', async () => {
        if (controller) {
            controller.abort();
            return;
        }

        const prompt = promptEl.value.trim();
        if (!prompt) return;

        outputEl.classList.remove('placeholder');
        outputEl.textContent = '';
        statTokens.textContent = '—';
        statTime.textContent   = '—';
        statSpeed.textContent  = '—';

        btnGenerate.textContent = 'Stop';
        btnGenerate.classList.add('stopping');

        controller = new AbortController();

        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        outputEl.appendChild(cursor);

        const t0 = performance.now();
        let tokenCount = 0;

        try {
            const res = await fetch('/generate/stream', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({
                    prompt:      prompt,
                    max_tokens:  parseInt(maxTokensEl.value),
                    temperature: parseFloat(tempEl.value),
                    top_p:       1.0,
                }),
                signal: controller.signal,
            });

            const reader  = res.body.getReader();
            const decoder = new TextDecoder();
            let   buffer  = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const payload = line.slice(6).trim();
                    if (payload === '[DONE]') break;
                    try {
                        const { token } = JSON.parse(payload);
                        cursor.remove();
                        outputEl.appendChild(document.createTextNode(token));
                        outputEl.appendChild(cursor);
                        tokenCount++;
                        const elapsed = (performance.now() - t0) / 1000;
                        statTokens.textContent = tokenCount;
                        statTime.textContent   = elapsed.toFixed(1) + 's';
                        statSpeed.textContent  = (tokenCount / elapsed).toFixed(1) + ' tok/s';
                    } catch (_) {}
                }
            }
        } catch (e) {
            if (e.name !== 'AbortError') {
                cursor.remove();
                outputEl.appendChild(
                    document.createTextNode('\n[Error: ' + e.message + ']')
                );
            }
        } finally {
            cursor.remove();
            controller = null;
            resetBtn();
        }
    });

    function resetBtn() {
        btnGenerate.textContent = 'Generate';
        btnGenerate.classList.remove('stopping');
        btnGenerate.disabled = false;
    }
</script>
</body>
</html>
